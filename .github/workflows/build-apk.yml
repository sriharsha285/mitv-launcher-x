name: Build Pure Android 9 MiTV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Pure Android 9 TV Project
        run: |
          mkdir -p app/src/main/java/com/custom/mitvlauncher
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

          cat << 'EOF' > settings.gradle
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace "com.custom.mitvlauncher"
              compileSdkVersion 33
              defaultConfig {
                  applicationId "com.custom.mitvlauncher"
                  minSdkVersion 21
                  targetSdkVersion 28
                  versionCode 2
                  versionName "2.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:label="Mi TV Studio PRO"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale"
                      android:launchMode="singleTask"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/custom/mitvlauncher/MainActivity.java
          package com.custom.mitvlauncher;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.parseColor("#07080c"));
                  setContentView(webView);

                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setMediaPlaybackRequiresUserGesture(false);
                  ws.setAllowFileAccess(true);
                  ws.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.addJavascriptInterface(new TVBridge(), "AndroidTV");

                  webView.setFocusable(true);
                  webView.setFocusableInTouchMode(true);
                  webView.requestFocus(View.FOCUS_DOWN);

                  webView.loadUrl("file:///android_asset/index.html");
              }

              public class TVBridge {
                  @JavascriptInterface
                  public void launchApp(String pkg, String fallbackUrl) {
                      try {
                        PackageManager pm = getPackageManager();
                        Intent intent = pm.getLeanbackLaunchIntentForPackage(pkg);
                        if (intent == null) {
                            intent = pm.getLaunchIntentForPackage(pkg);
                        }
                        if (intent != null) {
                            intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                            startActivity(intent);
                            return;
                        }
                      } catch (Exception ignored) {}

                      try {
                          Intent marketIntent = new Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=" + pkg));
                          marketIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(marketIntent);
                      } catch (Exception e) {
                          if (fallbackUrl != null && !fallbackUrl.isEmpty()) {
                              Intent webIntent = new Intent(Intent.ACTION_VIEW, Uri.parse(fallbackUrl));
                              webIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(webIntent);
                          }
                      }
                  }

                  @JavascriptInterface
                  public void openSettings() {
                      try {
                          Intent intent = new Intent(Settings.ACTION_SETTINGS);
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(intent);
                      } catch (Exception ignored) {}
                  }
              }

              @Override
              public void onBackPressed() {
                  // Prevent Back button from accidentally closing the home launcher
              }
          }
          EOF

      - name: Compile APK with Gradle
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk MiTV-AXSO0-Launcher.apk

      - name: Upload Compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: MiTV-AXSO0-Launcher-Package
          path: MiTV-AXSO0-Launcher.apk
